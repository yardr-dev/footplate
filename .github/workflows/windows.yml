# footplate on Windows: it builds, and its tests pass, with a yard on another
# machine as the only yard there is (no socket, no yard of its own). The
# yard's own gate (.yardr/test) runs on a Mac, where there is no Windows to
# try; this is that try. The first job is the debug build, as the gate's. A
# release build also compiles gpui's shaders, with fxc.exe of the Windows
# SDK, and a Mac does not have that. So the second job builds the Windows zip
# of a release here, and scripts/release.sh takes it from the run of the
# commit it releases. It runs when a release asks, or by hand, and on no
# push. A builder on a Windows bead starts a run on its branch by hand: gh
# workflow run windows.yml --ref yard/<bead>.
name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    # Bash stops at the first command that fails; the runner's PowerShell
    # does not, for a program that is not its own.
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The edition is 2024, which wants a newer Rust than an image may carry.
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # gpui's tree is most of the build, and a cache of `target` would be
      # gigabytes: it is built each time.
      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # The Windows zip a release carries. It is built when a release asks for
  # it, or by hand, and never on a push.
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # fxc.exe compiles the shaders. gpui finds it in the Windows SDK of the
      # runner's image (GPUI_FXC_PATH names another).
      - name: Build
        run: cargo build --locked --release

      # The four files at the root of the zip, named for the version of
      # Cargo.toml as scripts/release.sh reads it. A checkout on Windows may
      # end its lines with CR LF, which the pattern does not match, so the CRs
      # go first.
      - name: Zip
        run: |
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir dist
          cp target/release/footplate.exe README.md LICENSE NOTICE dist
          (cd dist && 7z a -tzip "../footplate_${version}_windows_amd64.zip" footplate.exe README.md LICENSE NOTICE)

      # The footplate.exe that runs is the one in the zip, unpacked as a
      # person would. It has no console of its own, so on the runner its line
      # reaches this step through the pipe the shell gives it. It is read into
      # a variable and held to the version, then run again with nothing
      # capturing it, so that the log has the line as the exe says it.
      - name: Smoke
        run: |
          mkdir smoke
          7z x -osmoke "footplate_${version}_windows_amd64.zip"
          said=$(smoke/footplate.exe --version)
          echo "footplate.exe --version said: $said"
          [ "$said" = "footplate $version" ] || {
            echo "footplate.exe --version said [$said], not [footplate $version]" >&2
            exit 1
          }
          echo "footplate.exe --version, not captured:"
          smoke/footplate.exe --version

      # scripts/release.sh takes the zip of the commit it releases from the
      # artifacts after the run finishes. Each successful run leaves one, and
      # they count against the account's storage, so they are kept 30 days and
      # not the default 90. A job that is run again replaces its artifact,
      # since a name that is taken would fail the upload.
      - uses: actions/upload-artifact@v7
        with:
          name: footplate-windows-amd64
          path: footplate_${{ env.version }}_windows_amd64.zip
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          overwrite: true
