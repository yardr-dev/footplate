[package]
name = "footplate"
version = "0.9.0"
edition = "2024"
description = "A native window onto a yardr yard: talk with the crew, and with the crew a linked yard exposes"
publish = false

[dependencies]
# gpui as released on crates.io, not a git revision of Zed: 0.2.2 is the
# newest release there (8 Oct 2026). Pinned exactly, since gpui changes its
# API between patch releases. runtime_shaders has the Metal shaders compiled
# when the window opens and not by the build, which then needs no Metal
# toolchain of Xcode (a download of its own since Xcode 26); it changes
# nothing on Linux.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# An image goes to the yard in base64, in the JSON of the call. In gpui's
# tree already.
base64 = "0.22"
# The stream's thread hands its events to gpui's foreground through this.
async-channel = "2"
# A mail's time in the zone of the person reading.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Where a character ends, for the line that is typed in.
unicode-segmentation = "1"
# A yard that is not on this machine is reached over TLS, trusted by the
# system's roots; socket2 sets the keepalive std has no call for. All three
# are in gpui's tree already, rustls with ring as it is built there.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
socket2 = "0.6"
# What yardr's doctor names is fetched and checked here (fetch.rs). sha2 and
# flate2 are in gpui's tree already: the file's checksum, and its gzip. The
# tar inside is read by fetch.rs itself, which takes one name and nothing else.
sha2 = "0.10"
# The voice socket's upgrade checks Sec-WebSocket-Accept, the SHA-1 of the
# client's key and a fixed string (voice.rs): no security in it, and the one
# use. Already in the tree as uuid's dependency, so no new package.
sha1_smol = "1"
flate2 = "1"
# A session's screen arrives with the terminal's ANSI styling, which is
# untrusted bytes (anything an agent printed, including malformed
# escapes): parsed by vte (ansi.rs), the standard robust part, and not by
# hand. Pinned exactly, as what it feeds must not shift under it. Its one
# dependency is memchr, which is in the tree already, so it adds no weight.
vte = "=0.15.0"
# A dropped zip is unpacked on this machine into its files (draft.rs).
# Pinned exactly: the crate's API moves between major releases. Read-only,
# and deflate alone: what the usual tools write is stored or deflated, and
# an entry in another method is a marked row, not an error. flate2 is in
# the tree already, with its pure-Rust backend, so this adds no C.
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
# The tray's mark is its PNG decoded and, where white is chosen, turned
# (tray.rs); on Linux it is scaled to a panel's sizes, and the window's
# icon too (taskbar.rs). In gpui's tree already.
image = { version = "0.25", default-features = false, features = ["png"] }
# The Pair a phone pane draws the pairing's QR string as a QR code, which
# a phone scans in place of typing: encoded by qrcode (MIT OR Apache-2.0,
# pure Rust, no dependency of its own but image), rendered through the
# image crate above. Its image renderer alone: the svg and pic renderers
# draw nothing here.
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# A paired device and its yard speak over a Noise channel (e2e.rs), run by
# snow (Apache-2.0 OR MIT, pure Rust): Noise_IK with X25519, ChaChaPoly and
# SHA-256 alone, and no Noise construction of footplate's own. Pinned
# exactly, as the design names 0.10.0 (19 July 2025); risky-raw-split hands
# the finished handshake's two transport keys out, which each record then
# uses at its own nonce with its associated data, as the yard's flynn/noise
# copies do. Its own resolver brings the three algorithms and getrandom.
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom", "std", "risky-raw-split"] }
# The one AEAD a channel record is sealed with, at the nonce the record
# itself names (e2e.rs): snow's handshake ends in raw keys, and this is the
# primitive they are spent through, as the yard spends its flynn/noise
# copies. In snow's tree already, at the version it builds against.
chacha20poly1305 = "0.10"
# The call ids and session tags a channel mints are random bytes with no
# other source (e2e.rs); the system's is asked through this, on every
# platform. In snow's tree already.
getrandom = "0.3"
# A pairing code that is typed or read aloud is redeemed through SPAKE2
# (pake.rs), as RFC 9382 has it and as the yard's own library runs it: the
# P-256 suite with SHA-256, HKDF and HMAC, which pakery-crypto's Spake2P256
# is. pakery is the one Rust implementation of that suite crates.io offered
# (RustCrypto's spake2 and its Conflux fork are Ed25519 and ristretto255
# alone, other variants that could not speak the yard's), and footplate has
# no PAKE arithmetic of its own. It is young (0.1.0 in March 2026, one
# maintainer) and states no audit, and nothing of footplate claims one for
# it. Pinned exactly, as the three are released
# together and the key schedule must not shift under the yard's pin. The
# ristretto255 and CPace halves of pakery-crypto are left off: its defaults
# would bring a second curve25519-dalek for nothing.
pakery-spake2 = { version = "=0.6.2", default-features = false, features = ["std"] }
pakery-crypto = { version = "=0.6.2", default-features = false, features = ["std", "p256", "spake2"] }
pakery-core = { version = "=0.6.2", default-features = false, features = ["std"] }
# pakery draws its ephemeral scalar from the rand_core 0.10 trait, which the
# system's randomness meets through getrandom 0.4's SysRng (feature sys_rng).
# Both are in gpui's tree already; the 0.3 above stays snow's and the call
# ids'.
rand_core = "0.10"
getrandom04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }

# The microphone and the speaker of a voice session (audio.rs): cpal, the
# crate that spikes/voice-harness ran live on a Linux desktop and measured on
# a Mac. Apache-2.0, and pinned exactly since it changes its API between
# releases. For macOS and Linux alone: Windows has no voice yet, so its tree
# gains nothing. On macOS it binds CoreAudio through objc2 bindings, no C
# library. On Linux it binds ALSA whatever features are chosen, which is the
# one C library voice adds: the build wants libasound2-dev (and pkg-config),
# and the program libasound.so.2 at run time (Debian 13: libasound2t64).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cpal = "=0.18.2"

# gpui's window options have no icon: on macOS the dock's is set on the
# application, with the bindings gpui itself is built on. So is the number
# on it (dock.rs), which gpui has no call for either, the item in the
# menu bar with its menu (tray.rs), and the move of the window by the top
# of its content (titlebar.rs), which gpui has no macOS call for: more
# features of the same crates, and no crate more.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSDockTile", "NSEvent", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSError", "NSGeometry", "NSString"] }
# A notification of the system's (notify.rs) goes through the user
# notifications framework, whose answers come to blocks. block2 is in
# gpui's tree already; the framework's bindings are the one crate footplate
# adds, of the same family as those above.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# A weighty approval passes the Mac's unlock first (unlock.rs): Touch ID,
# a paired watch or the login password, through LocalAuthentication. The
# context alone, with its policy and the blocks its answers come to: no
# other framework of the crate's.
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext"] }
# A Mac that has refused the microphone gives an app silence and no error, so
# a voice session reads the consent itself (audio.rs), from AVFoundation,
# before the microphone opens and again after. Its first request waits on
# AVCaptureDevice's answer block, so block2 is enabled here; it is already in
# the tree for the other system calls.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }

# On Linux the icon is also a property of the X11 window, set on a
# connection of our own: gpui hands out no handle to its X11 window. In
# gpui's tree already.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# Used by footplate for getuid alone (unlock.rs): this holds libc back for
# gpui's tree. gpui 0.2.2
# unpacks archives with zed-async-tar, whose xattr 0.2 wants libc::ENOATTR,
# and libc 0.2.190 no longer has it on Linux: the Linux build fails there
# ("cannot find value `ENOATTR` in crate `libc`"), and the gate, on a Mac,
# does not see it. Drop this when a libc has it again or gpui's tree no
# longer asks.
libc = ">=0.2.170, <0.2.190"
# The item in a desktop's tray (tray.rs) is a StatusNotifierItem, spoken
# over D-Bus by ksni, in Rust alone: no library of the system's is built
# against. It speaks through zbus, which is in gpui's tree already, and
# with async-io as gpui's has it: ksni's usual tokio would turn the one
# zbus of the tree to tokio under gpui too. blocking has it run on a thread
# of its own.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
# A weighty approval passes polkit first (unlock.rs), on the system bus:
# the same zbus, with no feature more, and async-io, which it runs on, to
# wait for its answer on a thread of footplate's. Both in the tree
# already. libc's getuid names the person to polkit beside the pid.
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"

# Stopping an event stream (api.rs) cancels the read that waits on it, since
# shutting the socket down does not wake that read on Windows. The one call,
# CancelIoEx, of the crate that is in gpui's tree already, with the two
# features it needs: no crate more.
# A login shell that hangs is stopped with its process group (fetch.rs).
[target.'cfg(unix)'.dependencies]
libc = ">=0.2.170, <0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
# The window's own test opens it on gpui's test platform, without a screen.
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"
# A test replays a run of the PAKE from the device scalar it fixes, which
# pakery lets only a test-utils build do, as the library's own RFC vectors
# do. Nothing of it is in the built footplate.
pakery-spake2 = { version = "=0.6.2", default-features = false, features = ["std", "test-utils"] }
# The keepalive the client sets is read back from its socket, which only
# socket2's "all" calls do. Nothing of it is in the built footplate.
socket2 = { version = "0.6", features = ["all"] }

# The root guards use geteuid in tests on macOS too; the libc dependency
# above is Linux-only, where it also pins gpui's build tree. Windows has
# no geteuid, and the tests that need one are unix-only.
[target.'cfg(unix)'.dev-dependencies]
libc = ">=0.2.170, <0.2.190"
